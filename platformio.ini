[platformio]
default_envs = mk-signal-div-v2-1-stable
src_dir = ESP32-DIV

[env:mk-signal-div-v2-1-stable]
platform = espressif32@6.9.0
platform_packages = framework-arduinoespressif32@https://github.com/espressif/arduino-esp32/releases/download/2.0.10/esp32-2.0.10.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_build.flash_size = 16MB
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_qspi
; V1.67 carries the multilingual glyph subset in the application image.  The
; stock min_spiffs layout left only 1.875 MiB per app despite the 16 MiB flash;
; keep dual-app safety while giving each image 3 MiB.
board_build.partitions = partitions_mk_signal.csv
monitor_speed = 115200
upload_port = COM4
monitor_port = COM4
monitor_dtr = 0
monitor_rts = 0
extra_scripts = pre:build-tools/prepare_build.py
; Self-contained stable release. The exact validated dependencies are bundled
; in lib/; the two board-custom libraries are extracted into vendor/ at build.
lib_extra_dirs =
  vendor
  lib
build_flags =
  -D ARDUINO_USB_CDC_ON_BOOT=0
  -D CORE_DEBUG_LEVEL=3
  -D ESP32DIV_VERSION=\"1.7.2-stable-by_MK_SIGNAL_v1.67\"
